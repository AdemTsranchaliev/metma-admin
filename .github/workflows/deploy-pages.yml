name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build:gh-pages
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: "/metma-admin"
          NEXT_PUBLIC_USE_FIREBASE: "true"
          NEXT_PUBLIC_USE_MOCK_DATA: "false"
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyB7lyONAEf7mazRUPQEYWzvW_oeEjPsNkg
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: metma-d78fd.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: metma-d78fd
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: metma-d78fd.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "549679796172"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:549679796172:web:c05c4fc96b931cb8eb1769
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
